services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: featureforge
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: featureforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - featureforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureforge -d featureforge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  featureforge-postgres:
