name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: featureforge
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: featureforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U featureforge -d featureforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FEATUREFORGE_POSTGRES_DSN: postgresql://featureforge:localdev@127.0.0.1:5433/featureforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[postgres]'
      - run: python -m unittest discover -s tests -v
